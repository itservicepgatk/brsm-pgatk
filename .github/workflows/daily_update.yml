name: Ежедневное обновление новостей

on:
  schedule:
    - cron: "0 21 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установка зависимостей
        run: |
          pip install requests beautifulsoup4 Pillow

      - name: Запуск парсера новостей (сжатие в WebP)
        run: |
          python update_news.py

      - name: Минификация CSS
        run: |
          python minify_css.py

      - name: Commit & Push
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add assets/js/news-data.js assets/img/news/ assets/css/style.min.css

          git diff --quiet && git diff --staged --quiet || (git commit -m "Автоматическое обновление новостей и изображений WebP [Bot]" && git push)

      - name: Деплой на Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: |
          npx vercel --prod --yes --token $VERCEL_TOKEN --scope team_Yf1v5k0YrecaVlwZZmEowUD1
